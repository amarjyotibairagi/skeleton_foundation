name: Security and reliability gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        # An explicit bash shell runs with -o pipefail, so a failing command
        # piped through tee fails the step instead of reporting tee's status.
        shell: bash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/platform_db
      DATABASE_URL: postgresql://platform_bff_runtime:ci-platform-runtime-password@127.0.0.1:5432/platform_db
      PLATFORM_BFF_DATABASE_URL: postgresql://platform_bff_runtime:ci-platform-runtime-password@127.0.0.1:5432/platform_db
      PUBLIC_DATABASE_URL: postgresql://consumer_bff_login:ci-consumer-password@127.0.0.1:5432/platform_db
      PUBLIC_DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/platform_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/platform_db
      TENANT_REGISTRY_DATABASE_URL: postgresql://tenant_registry_reader_login:ci-registry-password@127.0.0.1:5432/platform_db
      TENANT_PROVISIONER_DATABASE_URL: postgresql://tenant_provisioner_login:ci-provisioner-password@127.0.0.1:5432/platform_db
      TENANT_CREDENTIALS_DIR: /tmp/skeleton-ci-tenants
      TENANT_PGBOUNCER_AUTH_FILE: /tmp/skeleton-ci-pgbouncer-users.txt
      TENANT_PGBOUNCER_HOST: 127.0.0.1
      TENANT_PGBOUNCER_PORT: 6360
      TENANT_PGBOUNCER_ADMIN_USER: tenant_pgbouncer_admin
      TENANT_PGBOUNCER_ADMIN_PASSWORD: ci-pgbouncer-admin-password
      # Fixture tenants log in through the CI PgBouncer, so the provisioner
      # must reload it after adding each tenant login.
      TENANT_PGBOUNCER_RELOAD_DISABLED: 'false'
      TENANT_POOL_DATABASE_URL: postgresql://tenant_pool_login:ci-pool-password@127.0.0.1:5432/platform_db
      STORAGE_ROOT: /tmp/skeleton-ci-storage
      INTEGRATION_SECRET_KEY: dGVzdC1vbmx5LWludGVncmF0aW9uLWtleS0zMmJ5dGU=
      TENANT_ROOT_DOMAIN: sandbox.test
      TEST_TENANTS_FILE: /tmp/platform-test-tenants.json
      PLATFORM_HOSTNAME: platform.sandbox.test
      PLATFORM_FRONTEND_ORIGIN: https://platform.sandbox.test
      PLATFORM_PUBLIC_ORIGIN: https://platform.sandbox.test
      PUBLIC_PUBLIC_ORIGIN: https://user.sandbox.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Install and start CI PgBouncer
        # Generated here with the throwaway CI values above, so no fixture
        # credentials are committed. Its auth file is the one the provisioner
        # writes tenant logins into, as on a real installation.
        run: |
          sudo apt-get update && sudo apt-get install -y pgbouncer
          printf '"%s" "%s"\n' "$TENANT_PGBOUNCER_ADMIN_USER" "$TENANT_PGBOUNCER_ADMIN_PASSWORD" > "$TENANT_PGBOUNCER_AUTH_FILE"
          chmod 600 "$TENANT_PGBOUNCER_AUTH_FILE"
          cat > /tmp/skeleton-ci-pgbouncer.ini <<EOF
          [databases]
          platform_db = host=127.0.0.1 port=5432 dbname=platform_db

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = $TENANT_PGBOUNCER_PORT
          unix_socket_dir =
          auth_type = scram-sha-256
          auth_file = $TENANT_PGBOUNCER_AUTH_FILE
          admin_users = $TENANT_PGBOUNCER_ADMIN_USER
          pool_mode = transaction
          max_client_conn = 100
          default_pool_size = 5
          max_db_connections = 20
          ignore_startup_parameters = extra_float_digits
          pidfile = /tmp/skeleton-ci-pgbouncer.pid
          logfile = /tmp/skeleton-ci-pgbouncer.log
          EOF
          pgbouncer -d /tmp/skeleton-ci-pgbouncer.ini
      - run: bash scripts/ci-bootstrap-db.sh
      - name: Run unit tests
        run: |
          OUTPUT=$(npm run test:unit 2>&1 | tee /tmp/unit-test.log)
          if echo "$OUTPUT" | grep -q 'ℹ skipped [1-9]'; then
            echo "Error: Skipped unit tests detected!"
            exit 1
          fi
      - name: Run integration tests
        run: |
          OUTPUT=$(npm run test:integration 2>&1 | tee /tmp/integration-test.log)
          if echo "$OUTPUT" | grep -q 'ℹ skipped [1-9]'; then
            echo "Error: Skipped integration tests detected!"
            exit 1
          fi
      - name: Verify migration ledger matches the manifest
        # Fails on checksum drift (an applied migration file was edited) or on a
        # migration the database never ran. This is the gate that would have
        # caught CI and production diverging on migrations 017 and 018.
        run: npm run verify:migrations
      - name: Verify tenant registry agrees with the cluster
        # Registry rows, schemas, database roles, credential files, and the
        # PgBouncer auth file must all agree. Any drift fails the build.
        run: npm run verify:tenants
      - name: Verify all platform operator hashes are argon2id
        run: node scripts/platform-operator.mjs audit-hashes
      - run: npm run scan:secrets
      - name: Restore drill
        run: bash scripts/validate-backup-restore.sh
        env:
          # The service container only accepts password logins over TCP.
          PGPASSWORD: postgres
      - run: npm audit --audit-level=high
